name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Smoke run con datos sintéticos
        run: |
          python tests/synthetic.py data/raw/synthetic.csv.gz
          python scripts/make_dataset.py --raw data/raw/synthetic.csv.gz
          python scripts/train.py --models logreg scorecard lightgbm --no-readme
          python scripts/leakage_ablation.py --raw data/raw/synthetic.csv.gz
          python scripts/make_deck.py
